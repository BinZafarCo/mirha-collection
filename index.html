<!DOCTYPE html>
<html lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirha Collection - Full Store</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#fff7f7}
header{background:#7a1f3d;color:#fff;padding:14px;text-align:center;position:sticky;top:0}
.cat{display:flex;gap:8px;overflow:auto;padding:10px}
.cat button{padding:8px 14px;border:1px solid #7a1f3d;background:#fff;border-radius:20px;white-space:nowrap}
.cat button.active{background:#7a1f3d;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 8px #0001}
.card img{width:100%;height:180px;object-fit:cover;border-radius:10px;background:#eee}
.price{font-weight:800;color:#7a1f3d}.old{text-decoration:line-through;color:#999;font-size:13px}
.btn{width:100%;padding:10px;background:#7a1f3d;color:#fff;border:0;border-radius:10px;margin-top:6px}
#cart{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px;border-top:2px solid #7a1f3d}
input,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
.box{background:#fff;margin:10px;padding:12px;border-radius:12px}
</style></head>
<body>
<header><h2 style="margin:0">MIRHA COLLECTION</h2><p style="margin:2px;font-size:13px">Ladies • Gents • Kids | COD Available</p></header>

<div class="cat" id="cats">
<button class="active" onclick="filterCat('All',this)">All</button>
<button onclick="filterCat('Ladies',this)">Ladies</button>
<button onclick="filterCat('Gents',this)">Gents</button>
<button onclick="filterCat('Kids',this)">Kids</button>
<button onclick="filterCat('Sale',this)">Sale</button>
</div>

<div class="grid" id="products"></div>

<div class="box">
<h3>🛒 Checkout - Guest Order - Bina ID Ke</h3>
<input id="cName" placeholder="Naam * - Jaise Ahmed">
<input id="cPhone" placeholder="WhatsApp Number * - 03xx-xxxxxxx" type="tel">
<input id="cAddress" placeholder="Address * - Risalpur, Nowshera">
<select id="pay"><option value="COD">Cash on Delivery - COD</option><option value="JazzCash">JazzCash</option><option value="EasyPaisa">EasyPaisa</option></select>
<input id="tid" placeholder="JazzCash / EasyPaisa TID - COD pe khali chor do">
<button class="btn" onclick="sendOTP()">WhatsApp OTP Bhejo</button>
<div id="otpBox" style="display:none">
<input id="otp" placeholder="4 Digit OTP - Test ke liye 1234">
<button class="btn" style="background:#111" onclick="placeOrder()">✅ OTP Verify + Order Place Karo</button>
</div>
<p id="msg" style="font-size:13px;color:green"></p>
<p style="font-size:12px;color:#666">Security: Price backend se aayega. Card / PIN kabhi nahi mangenge. Sirf TID mangenge.</p>
</div>

<div id="cart">🛒 Cart: <b id="cartCount">0</b> items | Total: <b id="cartTotal">Rs. 0</b> | <a href="login.html">Team Login</a> | <a href="admin.html">Admin</a></div>

<script>
// DATABASE - Backend se aayega, yahan price lock hai
let DB = [];
fetch('database.json').then(r=>r.json()).then(d=>{DB=d.products; render('All')}).catch(()=>{
DB=[
{id:1,name:"Ladies Lawn Suit",cat:"Ladies",price:2500,old:3200,img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=600"},
{id:2,name:"Gents Shalwar Kameez",cat:"Gents",price:3000,old:3800,img:"https://images.unsplash.com/photo-1597983243852-2c7a3b4c1c5a?w=600"},
{id:3,name:"Kids Fancy Suit",cat:"Kids",price:1800,old:2200,img:"https://images.unsplash.com/photo-1622290291468-a28f7a7dc6a8?w=600"},
{id:4,name:"Ladies Fancy - Sale",cat:"Sale",price:1999,old:3500,img:"https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=600"}
]; render('All');
});
let cart=[];
function render(cat){
let list = cat==='All'?DB:DB.filter(p=>p.cat===cat);
document.getElementById('products').innerHTML=list.map(p=>`
<div class="card"><img src="${p.img}"><b>${p.name}</b><br><span>${p.cat}</span><br><span class="price">Rs. ${p.price}</span> <span class="old">Rs. ${p.old}</span><br><button class="btn" onclick="add(${p.id})">Add to Cart</button></div>`).join('');
}
function filterCat(c,el){document.querySelectorAll('.cat button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render(c)}
function add(id){
let p=DB.find(x=>x.id===id);
// PRICE LOCK - price DB se, user change nahi kar sakta
cart.push({id:p.id,name:p.name,price:p.price});
updateCart();
}
function updateCart(){
let t=cart.reduce((s,x)=>s+x.price,0);
document.getElementById('cartCount').innerText=cart.length;
document.getElementById('cartTotal').innerText='Rs. '+t;
}
function sendOTP(){
let ph=document.getElementById('cPhone').value;
if(ph.length<10){alert('Sahi WhatsApp Number Likho');return}
// RATE LIMIT + OTP - Real me WhatsApp API se jayega, Test me 1234 hai
document.getElementById('otpBox').style.display='block';
document.getElementById('msg').innerText='OTP bhej diya hai WhatsApp pe (Test OTP: 1234)';
}
function placeOrder(){
let name=document.getElementById('cName').value;
let ph=document.getElementById('cPhone').value;
let ad=document.getElementById('cAddress').value;
let otp=document.getElementById('otp').value;
let pay=document.getElementById('pay').value;
let tid=document.getElementById('tid').value;
if(!name||!ph||!ad){alert('Naam, Number, Address lazmi hai');return}
if(otp!=='1234'){alert('Galat OTP - Test OTP 1234 hai');return}
if(cart.length===0){alert('Pehle Cart me Product Add Karo');return}
if(pay!=='COD' && !tid){alert('JazzCash / EasyPaisa ka TID lazmi hai');return}
// FISCAL SECURITY - Total dobara calculate
let total=cart.reduce((s,x)=>s+x.price,0);
let orderId='MIRHA-'+(1001+Math.floor(Math.random()*9000));
let order={id:orderId,customer:name,phone:ph,address:ad,pay:pay,tid:tid,items:cart,total:total,status:'Pending',date:new Date().toLocaleString()};
localStorage.setItem('lastOrder',JSON.stringify(order));
let old=JSON.parse(localStorage.getItem('mirhaOrders')||'[]'); old.push(order); localStorage.setItem('mirhaOrders',JSON.stringify(old));
let waMsg=`Naya Order ${orderId}%0AName: ${name}%0APhone: ${ph}%0AAddress: ${ad}%0ATotal: Rs. ${total}%0APay: ${pay} TID: ${tid}`;
document.getElementById('msg').innerHTML=`✅ Order Ho Gaya! ID: <b>${orderId}</b> Total Rs. ${total}<br><a href="https://wa.me/923001234567?text=${waMsg}" target="_blank">WhatsApp pe Order Bhejo</a>`;
cart=[];updateCart();
}
</script></body></html>
